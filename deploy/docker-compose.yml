# 通用框架本地部署模板（只跑 API；内存实现，无外部依赖）
#
# 用法：
#   cp .env.example .env
#   docker compose up -d
#
# 生产请复制本文件到自己的私有仓，按需添加 MySQL / Redis / IM 服务；
# 不要把产品域名、品牌或凭据写回本仓。

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      CHAT_PROVIDER: "${CHAT_PROVIDER:-memory}"
      APP_VERSION: "${APP_VERSION:-dev}"
      APP_LATEST: "${APP_LATEST:-0.1.0}"
      APP_MIN_SUPPORTED: "${APP_MIN_SUPPORTED:-0.1.0}"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m